name: Siemens-independent checks

on:
  push:
  pull_request:

jobs:
  independent-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and run independent checks
        run: dotnet run --project tests/InspectorLogic.Tests.csproj --configuration Release

# The net48 desktop application is intentionally not built in cloud CI because
# Siemens TIA Portal Openness assemblies are local, licensed dependencies and
# must not be copied into this repository.
